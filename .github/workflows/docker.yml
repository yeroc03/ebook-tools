# Builds the image, runs the repository's tests inside it, and publishes it
# to GitHub's registry as ghcr.io/<owner>/ebook-tools:
#
#   a push to master   -> :latest and :sha-<commit>
#   a tag v1.2         -> :v1.2
#   a pull request     -> built and tested only
name: docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --pull -t ebook-tools:test .

      - name: Test
        run: |
          docker run --rm --user 1000:1000 -v "$PWD/tests:/ebook-tools/tests:ro" \
              ebook-tools:test /ebook-tools/tests/run.sh
          docker run --rm --user 1000:1000 ebook-tools:test calibredb --version

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ebook-tools"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
              tags=("${GITHUB_REF#refs/tags/}")
          else
              tags=(latest "sha-${GITHUB_SHA::7}")
          fi
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for i in "${tags[@]}"; do
              docker tag ebook-tools:test "$image:$i"
              docker push "$image:$i"
          done
